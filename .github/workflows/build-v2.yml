name: Build v2

on:
  push:
    branches:
      - '*-bbb'
  pull_request:
    branches:
      - '*-bbb'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Prepare cabal/ci-nofreeze.* so the cache key has something to hash
      - name: Prepare cabal config/freezes
        run: ./scripts/build-v2.sh cabal-files

      # Cache Cabal store (dependencies)
      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: cabal-store-${{ runner.os }}-${{ hashFiles('cabal/ci-nofreeze.project.freeze') }}
          restore-keys: |
            cabal-store-${{ runner.os }}-

      # (Optional) cache dist-newstyle for even faster rebuilds
      - name: Cache dist-newstyle
        uses: actions/cache@v4
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ hashFiles('cabal/ci-nofreeze.project.freeze') }}
          restore-keys: |
            dist-${{ runner.os }}-

      # Install all deps (system & ghcup/cabal) using the script
      - name: Install dependencies (toolchain + ghc + cabal)
        run: ./scripts/build-v2.sh deps --ci

      - name: Detect Cabal store
        run: |
          echo "HOME=$HOME"
          echo "Checking XDG state home:"
          echo "$XDG_STATE_HOME"
          echo
          echo "Checking default new-style store:"
          if [ -d "$HOME/.local/state/cabal/store" ]; then
            echo "Found: $HOME/.local/state/cabal/store"
          else
            echo "Not found"
          fi
          echo
          echo "Checking legacy store:"
          if [ -d "$HOME/.cabal/store" ]; then
            echo "Found: $HOME/.cabal/store"
          else
            echo "Not found"
          fi
          echo
          echo "Effective config (user-config diff):"
          cabal user-config diff || true

      - name: Build
        run: ./scripts/build-v2.sh build --ci --jobs 4

      - name: Upload graphql-engine binary
        uses: actions/upload-artifact@v4
        with:
          name: graphql-engine
          path: dist-newstyle/build/x86_64-linux/ghc-9.10.2/graphql-engine-1.0.0/x/graphql-engine/opt/build/graphql-engine/graphql-engine

